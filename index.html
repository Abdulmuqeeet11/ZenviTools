    <meta

    />
    <meta name="theme-color" content="#7045C6" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('zenvi-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Zenvi Tools",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "description": "All Your Tools. One Place. Free, privacy-first online PDF, calculator, image, text, and QR utilities that run directly in your browser.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
